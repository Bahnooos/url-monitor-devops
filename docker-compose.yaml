services:
  postgres:
    image: postgres:16-alpine
    container_name: url-monitor-postgres
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: monitordb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitordb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: url-monitor-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    build: .
    image: url-monitor-app:latest
    container_name: url-monitor-migrator
    command: alembic upgrade head
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    image: url-monitor-app:latest
    container_name: url-monitor-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: .
    image: url-monitor-app:latest
    command: celery -A app.worker worker --loglevel=info
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  beat:
    build: .
    image: url-monitor-app:latest
    container_name: url-monitor-beat
    command: celery -A app.worker beat --loglevel=info
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

volumes:
  postgres_data: